name: Hello JEV

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-openjev-v1

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.4

      - name: Test the refund policy (no model needed)
        run: python -m unittest discover -s tests -v

      - name: Check and test the OPA guardrails
        run: |
          opa check --strict policy/
          opa test policy/ -v

      - name: "Demo 1: hello world"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/run_openjev.py

      - name: "Demo 2: Jev judges, code decides"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/run_refund_demo.py

      - name: "Demo 3: Jev judges, Python decides, OPA checks"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/run_guardrails_demo.py

      - name: Show results
        if: always()
        run: cat site/results.json site/refund.json site/guardrails.json

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: run-model
    if: always() && needs.run-model.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
